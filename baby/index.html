<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Трекер Таисии</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👧</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F1014">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="light"] {
            --bg: #F9FAFB; --card: #FFFFFF; --text: #111827; --muted: #6B7280;
            --border: #E5E7EB; --shadow: rgba(0,0,0,0.06);
            --feed: #FCA5A5; --sleep: #93C5FD; --awake: #FCD34D; --noise: #6EE7B7; --sos: #F87171;
            --btn-text: #FFFFFF;
        }
        :root[data-theme="dark"] {
            --bg: #0F1014; --card: #1C1D22; --text: #F3F4F6; --muted: #9CA3AF;
            --border: #2D2E36; --shadow: rgba(0,0,0,0.4);
            --feed: #7F1D1D; --sleep: #1E3A8A; --awake: #78350F; --noise: #064E3B; --sos: #991B1B;
            --btn-text: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-top: env(safe-area-inset-top); padding-bottom: calc(90px + env(safe-area-inset-bottom)); min-height: 100vh; transition: background 0.3s; }
        
        .view { display: none; opacity: 0; }
        .view.active { display: block; opacity: 1; animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { position: sticky; top: 0; z-index: 10; padding: 20px; text-align: center; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; transition: background 0.3s; }
        .header h1 { font-size: 24px; font-weight: 800; }
        .last-feed-badge { background: var(--feed); color: var(--btn-text); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; display: none; box-shadow: 0 4px 10px var(--shadow); }
        
        /* ТАЙМЕРЫ */
        .timer-box { background: var(--card); border-radius: 28px; padding: 24px; margin: 20px 20px 10px 20px; text-align: center; border: 1px solid var(--border); box-shadow: 0 8px 24px var(--shadow); display: flex; flex-direction: column; gap: 15px; }
        .timer-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 16px; border-radius: 20px; transition: background 0.3s; }
        .timer-label { font-weight: 700; color: var(--muted); font-size: 14px; text-align: left; }
        .timer-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .timer-active { border: 2px solid var(--awake); background: var(--card); }
        
        /* КНОПКИ */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 20px; }
        .action-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 18px 10px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-btn:active { transform: scale(0.92); }
        .action-btn .icon { font-size: 32px; }
        
        .btn-feed { grid-column: span 2; background: var(--feed); color: white; border: none; }
        .btn-awake-toggle { grid-column: span 2; background: var(--awake); color: #111827; border: none; font-size: 18px; padding: 22px; }
        .btn-noise { grid-column: span 2; background: var(--noise); color: #111827; border: none; }
        .btn-sos { grid-column: span 2; background: var(--sos); color: white; border: none; font-size: 18px; padding: 16px; }
        .btn-diaper { background: var(--card); font-size: 14px; }

        /* ЛЕНТА */
        .log-section { padding: 20px; }
        .log-list { background: var(--card); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 12px var(--shadow); }
        .log-date-title { padding: 12px 16px; background: var(--bg); font-weight: 800; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
        .log-item:last-child { border-bottom: none; }
        .log-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .log-icon { font-size: 24px; background: var(--bg); padding: 8px; border-radius: 14px; }
        .log-name { font-weight: 700; font-size: 16px; }
        .log-sub { color: var(--muted); font-size: 13px; font-weight: 600; }
        .log-right { display: flex; align-items: center; gap: 10px; }
        .log-time { color: var(--text); font-weight: 700; font-size: 14px; background: var(--bg); padding: 4px 10px; border-radius: 10px; }
        .badge-duration { color: var(--text); font-size: 13px; font-weight: 700; background: var(--bg); padding: 4px 10px; border-radius: 10px; }
        .btn-delete { background: none; border: none; color: var(--muted); font-size: 18px; padding: 5px; cursor: pointer; }

        /* НИЖНЯЯ НАВИГАЦИЯ (Как в FWD Tools) */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--card); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; align-items: center; 
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); 
            z-index: 50; transition: background 0.3s;
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            color: var(--muted); font-size: 12px; font-weight: 700; 
            cursor: pointer; background: none; border: none; width: 50%;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-item:active { transform: scale(0.85); }
        .nav-item.active { color: var(--text); }
        .nav-item .icon { 
            font-size: 26px; padding: 8px 16px; border-radius: 20px; 
            transition: background 0.3s, transform 0.3s;
        }
        .nav-item.active .icon { 
            background: var(--bg); 
            transform: translateY(-2px);
        }

        /* СТАТИСТИКА */
        .stats-container { padding: 20px; }
        .stat-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); padding: 16px 8px; border-radius: 24px; text-align: center; box-shadow: 0 4px 12px var(--shadow); }
        .stat-card .value { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.2; }
        .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 12px var(--shadow); }
        .chart-wrap { position: relative; height: 220px; width: 100%; }
        .chart-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--text); text-align: center; }

        /* МОДАЛКИ */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-end; }
        .modal-content { background: var(--card); width: 100%; border-radius: 32px 32px 0 0; padding: 24px; animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding-bottom: calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h2 { font-size: 22px; font-weight: 800; }
        .btn-close { background: var(--bg); border: none; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        /* Слайдер мл */
        .slider-value { font-size: 48px; font-weight: 800; color: var(--text); text-align: center; margin-bottom: 10px; }
        .slider-value span { font-size: 24px; color: var(--muted); }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 10px; background: var(--border); border-radius: 10px; outline: none; margin-bottom: 24px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--feed); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        .btn-save-ml { background: var(--feed); color: white; border: none; padding: 18px; border-radius: 20px; font-size: 18px; font-weight: 800; width: 100%; cursor: pointer; box-shadow: 0 4px 15px var(--shadow); transition: transform 0.2s; }
        .btn-save-ml:active { transform: scale(0.95); }

        /* Белый шум */
        .noise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .noise-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 16px; border-radius: 20px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .noise-btn.active { border-color: var(--noise); background: var(--noise); color: #111827; }
        .noise-btn .icon { font-size: 32px; }
        .player-controls { display: flex; flex-direction: column; align-items: center; gap: 24px; background: var(--bg); padding: 24px; border-radius: 24px; }
        .btn-play-main { background: var(--noise); border: none; color: white; width: 72px; height: 72px; border-radius: 50%; font-size: 28px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; box-shadow: 0 8px 20px var(--shadow); }
        .btn-play-main.playing { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(110, 231, 183, 0); } 100% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0); } }
        .volume-container { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--muted); font-size: 20px; }
        .volume-slider { flex: 1; height: 6px; background: var(--border); border-radius: 10px; outline: none; -webkit-appearance: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--text); cursor: pointer; }
        /* УВЕДОМЛЕНИЯ */
        .toast-host { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
        .toast { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 12px 18px; border-radius: 16px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 24px var(--shadow); opacity: 0; transform: translateY(10px); transition: opacity .25s ease, transform .25s ease; text-align: center; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-color: #ef4444; }

        /* ИНДИКАТОР СЕТИ */
        .net-status { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
    </style>
</head>
<body>

    <div id="view-tracker" class="view active">
        <div class="header">
            <h1>👧 Трекер Таисии</h1>
            <div class="net-status" id="net-status" style="display: none;"></div>
            <div class="last-feed-badge" id="last-feed-badge">🍼 Последнее: давно</div>
        </div>

        <!-- ТАЙМЕРЫ -->
        <div class="timer-box">
            <div class="timer-row" id="row-sleep">
                <div class="timer-label">😴 Спит</div>
                <div class="timer-value" id="timer-sleep">00:00:00</div>
            </div>
            <div class="timer-row" id="row-awake">
                <div class="timer-label">👀 Бодрствует</div>
                <div class="timer-value" id="timer-awake">00:00:00</div>
            </div>
            <div class="timer-row" id="row-walk">
                <div class="timer-label">🚶‍♀️ Гуляет</div>
                <div class="timer-value" id="timer-walk">00:00:00</div>
            </div>
        </div>

        <div class="grid">
            <button class="action-btn btn-feed" onclick="openFeedModal()"><span class="icon">🍼</span> Покормить</button>
            
            <button class="action-btn btn-awake-toggle" id="awake-btn" onclick="toggleSleepAwake()">
                <span class="icon" id="state-icon">👀</span> <span id="state-text">Уложить спать</span>
            </button>
            <button class="action-btn" id="walk-btn" onclick="toggleWalk()" style="grid-column: span 2; padding: 22px; font-size: 18px; font-weight: 700;">
                <span class="icon" id="walk-icon">🚶‍♀️</span> <span id="walk-text">Погулять</span>
            </button>

            <button class="action-btn btn-diaper" onclick="quickEvent('diaper', 'Посранунькала')"><span class="icon">💩</span> Посранунькала</button>
            <button class="action-btn btn-diaper" onclick="quickEvent('diaper', 'Пописиюлькала')"><span class="icon">💦</span> Пописиюлькала</button>
            
            <button class="action-btn btn-noise" onclick="openNoiseModal()"><span class="icon">🎵</span> Белый шум</button>
            <button class="action-btn btn-sos" onclick="sendSOS()"><span class="icon">🆘</span> Да блять!</button>
            <button class="action-btn" id="push-btn" onclick="subscribePush()" style="grid-column: span 2; background: var(--bg);">
                <span class="icon">🔔</span> Включить уведомления
            </button>        
        </div>

        <div class="log-section">
            <div class="log-list" id="log-list"></div>
        </div>
    </div>

    <div id="view-stats" class="view">
        <div class="header">
            <h1>📊 Статистика</h1>
        </div>
        
        <div class="stats-container">
            <div class="stat-cards">
                <div class="stat-card">
                    <div class="value" id="stat-feeds">0</div>
                    <div class="label">Кормлений</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="stat-sleep">0ч</div>
                    <div class="label">Сна</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="stat-volume">0</div>
                    <div class="label">Съела (мл)</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Кормления и подгузники</div>
                <div class="chart-wrap"><canvas id="chart-feeds"></canvas></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Суточный цикл (часы)</div>
                <div class="chart-wrap"><canvas id="chart-sleep"></canvas></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Выпито смеси (мл)</div>
                <div class="chart-wrap"><canvas id="chart-volume"></canvas></div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    
    <div id="view-calendar" class="view">
        <div class="header"><h1>📅 Календарь</h1></div>
        <div class="stats-container">
            <button class="btn-save-ml" style="margin-bottom: 20px; background: var(--awake); color: #111827;" onclick="openAppModal()">➕ Добавить запись</button>
            <button class="btn-save-ml" style="margin-bottom: 20px; background: var(--card); color: var(--text); border: 1px solid var(--border);" onclick="exportData()">⬇️ Экспорт данных</button>
            <div class="log-list" id="app-list"></div>
        </div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchView('tracker', this)">
            <span class="icon">🏠</span> Трекер
        </button>
        <button class="nav-item" onclick="switchView('stats', this)">
            <span class="icon">📊</span> Статистика
        </button>
        <button class="nav-item" onclick="switchView('calendar', this)">
            <span class="icon">📅</span> Календарь
        </button>
    </div>

    <!-- МОДАЛКА КОРМЛЕНИЯ -->
    <div class="modal-overlay" id="feed-modal" onclick="closeFeedModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Сколько съела?</h2>
                <button class="btn-close" onclick="closeFeedModal()">✕</button>
            </div>
            <div class="slider-value"><span id="ml-value">120</span> <span>мл</span></div>
            <input type="range" id="ml-slider" min="10" max="240" step="10" value="120" oninput="document.getElementById('ml-value').innerText = this.value">
            <button class="btn-save-ml" onclick="saveFeedVolume()">Записать кормление</button>
        </div>
    </div>

    <!-- МОДАЛКА БЕЛОГО ШУМА -->
    <div class="modal-overlay" id="noise-modal" onclick="closeNoiseModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Белый шум</h2>
                <button class="btn-close" onclick="closeNoiseModal()">✕</button>
            </div>
            <div class="noise-grid">
                <button class="noise-btn active" data-sound="white" onclick="changeNoise(this)"><span class="icon">📻</span> Белый шум</button>
                <button class="noise-btn" data-sound="rain" onclick="changeNoise(this)"><span class="icon">🌧️</span> Дождь</button>
                <button class="noise-btn" data-sound="womb" onclick="changeNoise(this)"><span class="icon">🤰</span> Утроба</button>
                <button class="noise-btn" data-sound="heart" onclick="changeNoise(this)"><span class="icon">❤️</span> Сердце</button>
            </div>
            <div class="player-controls">
                <button class="btn-play-main" id="play-pause-btn" onclick="toggleAudio()">▶</button>
                <div class="volume-container">
                    <span>🔈</span>
                    <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.5" oninput="setVolume(this.value)">
                    <span>🔊</span>
                </div>
            </div>
        </div>
    </div>

    
    <div class="modal-overlay" id="app-modal" onclick="closeAppModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header"><h2>Новая запись</h2><button class="btn-close" onclick="closeAppModal()">✕</button></div>
            <input type="text" id="app-title" placeholder="Название (например, Педиатр)" style="width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; font-family: 'Nunito', sans-serif;">
            <input type="datetime-local" id="app-date" style="width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; font-family: 'Nunito', sans-serif;">
            <textarea id="app-notes" placeholder="Заметки (что взять, вопросы)" style="width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; font-family: 'Nunito', sans-serif; resize: none; height: 80px;"></textarea>
            <button class="btn-save-ml" style="background: var(--awake); color: #111827;" onclick="saveAppointment()">Сохранить</button>
        </div>
    </div>

    <script>
        // УМНАЯ ТЕМА (темная по умолчанию)
        const currentHour = new Date().getHours();
        const theme = (currentHour >= 9 && currentHour < 19) ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        const API_URL = 'https://telegram-bot-zakharsakharov.msk1.amvera.tech/api/baby';
        let activeSleepId = null;
        let activeAwakeId = null;
        const timerIntervals = {};
        let chartFeeds = null;
        let chartSleep = null;

        function switchView(viewName, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            btn.classList.add('active');
            if (viewName === 'stats') loadStats();
            if (viewName === 'calendar') loadAppointments();
        }

        // --- УВЕДОМЛЕНИЯ ---
        function toast(message, isError) {
            const host = document.getElementById('toast-host');
            if (!host) { return; }
            const el = document.createElement('div');
            el.className = 'toast' + (isError ? ' error' : '');
            el.textContent = message;
            host.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600);
        }

        // Обёртка над fetch: единая обработка сетевых ошибок
        async function apiFetch(url, options) {
            let res;
            try {
                res = await fetch(url, options);
            } catch (e) {
                toast("Нет связи с сервером", true);
                throw e;
            }
            if (!res.ok) {
                toast(`Ошибка сервера (${res.status})`, true);
                throw new Error('HTTP ' + res.status);
            }
            return res;
        }

        // ===== ЛОКАЛЬНЫЙ КЭШ, ОЧЕРЕДЬ И ЭКСПОРТ =====
        const CACHE_KEY = 'baby_events_cache_v1';
        const QUEUE_KEY = 'baby_queue_v1';

        function readJSON(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                const v = JSON.parse(raw);
                return v == null ? fallback : v;
            } catch (e) { return fallback; }
        }
        function writeJSON(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); }
            catch (e) { console.warn('localStorage:', e); }
        }

        function mergeIntoCache(events) {
            if (!Array.isArray(events) || !events.length) return;
            const cache = readJSON(CACHE_KEY, {});
            let changed = false;
            for (const e of events) {
                if (!e || e.id == null) continue;
                if (JSON.stringify(cache[e.id]) !== JSON.stringify(e)) { cache[e.id] = e; changed = true; }
            }
            if (changed) writeJSON(CACHE_KEY, cache);
        }

        function cachedEvents() {
            return Object.values(readJSON(CACHE_KEY, {}))
                .sort((a, b) => new Date(b.start_time) - new Date(a.start_time));
        }

        function newId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return String(Date.now()) + '-' + Math.random().toString(16).slice(2);
        }

        function enqueue(item) {
            const q = readJSON(QUEUE_KEY, []);
            q.push(Object.assign({ ts: Date.now() }, item));
            writeJSON(QUEUE_KEY, q);
            renderStatus();
        }

        async function flushQueue() {
            const q = readJSON(QUEUE_KEY, []);
            if (!q.length) { renderStatus(); return; }
            const left = [];
            for (const item of q) {
                try {
                    const res = await fetch(item.url, {
                        method: item.method || 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: item.body
                    });
                    if (!res.ok) left.push(item);
                } catch (e) { left.push(item); }
            }
            writeJSON(QUEUE_KEY, left);
            renderStatus();
            if (left.length !== q.length) {
                toast(`Отправлено из очереди: ${q.length - left.length}`);
                loadEvents();
            }
        }

        function renderStatus() {
            const el = document.getElementById('net-status');
            if (!el) return;
            const pending = readJSON(QUEUE_KEY, []).length;
            const offline = !navigator.onLine;
            if (!pending && !offline) { el.style.display = 'none'; el.textContent = ''; return; }
            el.style.display = 'inline-block';
            el.textContent = offline
                ? (pending ? `📴 офлайн · ${pending} в очереди` : '📴 офлайн')
                : `⏳ ждут отправки: ${pending}`;
        }

        window.addEventListener('online', () => { renderStatus(); flushQueue(); });
        window.addEventListener('offline', renderStatus);

        function exportData() {
            const payload = {
                app: 'baby-tracker',
                exported_at: new Date().toISOString(),
                events: cachedEvents(),
                appointments: window.__lastAppointments || [],
                pending: readJSON(QUEUE_KEY, [])
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'baby-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            toast(`Экспортировано записей: ${payload.events.length}`);
        }

        // --- АУДИО ---
        let audioCtx = null, gainNode = null, currentSource = null;
        let audioBuffers = {}, isPlaying = false, currentSound = 'white', isAudioLoading = false;
        const sounds = { 'white': 'sounds/white.mp3', 'rain': 'sounds/rain.mp3', 'womb': 'sounds/womb.mp3', 'heart': 'sounds/heart.mp3' };
        const playPauseBtn = document.getElementById('play-pause-btn');

        async function unlockAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            gainNode = audioCtx.createGain(); gainNode.gain.value = 0.5; gainNode.connect(audioCtx.destination);
        }
        async function loadSound(soundName) {
            if (audioBuffers[soundName]) return audioBuffers[soundName];
            const response = await fetch(sounds[soundName]);
            if (!response.ok) throw new Error("Файл не найден");
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[soundName] = await audioCtx.decodeAudioData(arrayBuffer);
            return audioBuffers[soundName];
        }
        function stopCurrentAudio() {
            if (currentSource) { try { currentSource.stop(); currentSource.disconnect(); } catch(e){} currentSource = null; }
            isPlaying = false; playPauseBtn.textContent = '▶'; playPauseBtn.classList.remove('playing');
        }
        async function playSound(soundName) {
            if (isAudioLoading) return;
            isAudioLoading = true;
            stopCurrentAudio();
            await unlockAudio();
            try {
                const buffer = await loadSound(soundName);
                currentSource = audioCtx.createBufferSource(); currentSource.buffer = buffer;
                currentSource.loop = true; currentSource.connect(gainNode); currentSource.start(0);
                isPlaying = true; playPauseBtn.textContent = '⏸'; playPauseBtn.classList.add('playing');
            } catch (e) { toast("Ошибка загрузки звука", true); }
            finally { isAudioLoading = false; }
        }
        async function changeNoise(btn) {
            document.querySelectorAll('.noise-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); currentSound = btn.getAttribute('data-sound');
            if (isPlaying) await playSound(currentSound);
        }
        async function toggleAudio() { if (isPlaying) { stopCurrentAudio(); } else { await playSound(currentSound); } }
        function setVolume(val) { if (gainNode) gainNode.gain.value = val; }
        function openNoiseModal() { document.getElementById('noise-modal').style.display = 'flex'; }
        function closeNoiseModal(e) { if (!e || e.target.id === 'noise-modal') document.getElementById('noise-modal').style.display = 'none'; }

        // --- ТРЕКЕР ---
        function formatDuration(ms) {
            const totalMinutes = Math.floor(ms / 60000);
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            if (h > 0) return `${h}ч ${m}м`;
            return `${m}м`;
        }

        let activeWalkId = null;

        async function toggleSleepAwake() {

        async function toggleWalk() {
            if (activeWalkId) {
                // Если гуляет — просто заканчиваем прогулку (остальное не трогаем)
                await fetch(`${API_URL}/events/${activeWalkId}/stop`, { method: 'POST' });
            } else {
                // Начинаем прогулку (сон или бодрствование не трогаем)

        async function loadEvents() {
            try {
                let events = [];
                try {
                    const res = await fetch(`${API_URL}/events/today`);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    events = await res.json();
                    if (!Array.isArray(events)) events = [];
                    mergeIntoCache(events);
                } catch (netErr) {
                    events = cachedEvents();
                    if (events.length) toast("Нет связи — показаны сохранённые записи", true);
                }
                renderStatus();
                
                const activeSleep = events.find(e => e.event_type === 'sleep' && !e.end_time);
                const activeAwake = events.find(e => e.event_type === 'awake' && !e.end_time);
                activeWalkId = events.find(e => e.event_type === 'walk' && !e.end_time)?.id || null;

                // Настройка таймеров
                if (activeSleep) {
                    activeSleepId = activeSleep.id;
                    document.getElementById('row-sleep').classList.add('timer-active');
                    startTimer('timer-sleep', new Date(activeSleep.start_time), 'sleep');
                    document.getElementById('awake-btn').style.background = 'var(--sleep)';
                    document.getElementById('state-text').innerText = 'Разбудить (Спит)';
                    document.getElementById('state-icon').innerText = '🌙';
                } else {
                    activeSleepId = null;
                    document.getElementById('row-sleep').classList.remove('timer-active');
                    if (timerIntervals.sleep) clearInterval(timerIntervals.sleep);
                    document.getElementById('awake-btn').style.background = 'var(--awake)';
                    document.getElementById('state-text').innerText = 'Уложить спать';
                    document.getElementById('state-icon').innerText = '👀';
                }

                if (activeAwake) {
                    activeAwakeId = activeAwake.id;
                    document.getElementById('row-awake').classList.add('timer-active');
                    startTimer('timer-awake', new Date(activeAwake.start_time), 'awake');
                } else {
                    activeAwakeId = null;
                    document.getElementById('row-awake').classList.remove('timer-active');
                    if (timerIntervals.awake) clearInterval(timerIntervals.awake);
                }

                const walkBtn = document.getElementById('walk-btn');
                if (activeWalkId) {
                    document.getElementById('row-walk').classList.add('timer-active');
                    startTimer('timer-walk', new Date(events.find(e=>e.id===activeWalkId).start_time), 'walk');
                    if (walkBtn) {
                        walkBtn.style.background = 'var(--noise)';
                        walkBtn.style.color = '#111827';
                        document.getElementById('walk-text').innerText = 'Закончить прогулку';
                    }
                } else {
                    document.getElementById('row-walk').classList.remove('timer-active');
                    if (timerIntervals.walk) clearInterval(timerIntervals.walk);
                    if (walkBtn) {
                        walkBtn.style.background = 'var(--card)';
                        walkBtn.style.color = 'var(--text)';
                        document.getElementById('walk-text').innerText = 'Погулять';
                    }
                }

                // Лента
                const lastFeed = events.find(e => e.event_type === 'feed');
                const feedBadge = document.getElementById('last-feed-badge');
                if (lastFeed) {
                    feedBadge.style.display = 'inline-block';
                    feedBadge.textContent = `🍼 Последнее: ${formatDuration(new Date() - new Date(lastFeed.start_time))} назад`;
                } else { feedBadge.style.display = 'none'; }

                const list = document.getElementById('log-list');
                list.innerHTML = '';
                
                // --- ЛОГИКА АККОРДЕОНА ПО ДНЯМ ---
                const grouped = {};
                const dayKey = (d) => new Date(d).toLocaleDateString('sv-SE', { timeZone: 'Europe/Moscow' });
                const todayKey = dayKey(new Date());
                const labelOf = (key) => new Date(key + 'T12:00:00+03:00')
                    .toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: 'long' });

                events.forEach(e => {
                    if ((e.event_type === 'sleep' || e.event_type === 'awake' || e.event_type === 'walk') && !e.end_time) return;
                    const k = dayKey(e.start_time);
                    if (!grouped[k]) grouped[k] = [];
                    grouped[k].push(e);
                });

                Object.keys(grouped).sort().reverse().forEach(key => {
                    const isToday = key === todayKey;
                    const dateStr = labelOf(key);
                    
                    if (isToday) {
                        list.innerHTML += `<div class="log-date-title">Сегодня</div>`;
                    } else {
                        list.innerHTML += `<div class="log-date-title" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'" style="cursor: pointer;">📅 ${dateStr} ▼</div>`;
                    }
                    
                    const containerStyle = isToday ? '' : 'display: none;';
                    list.innerHTML += `<div style="${containerStyle}">`;
                    
                    grouped[key].forEach(e => {
                    if ((e.event_type === 'sleep' || e.event_type === 'awake') && !e.end_time) return; 

                    let icon = "", name = "", sub = "", timeStr = "", badge = "";
                    const startTime = new Date(e.start_time);
                    const timeOptions = { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' };
                    timeStr = startTime.toLocaleTimeString('ru-RU', timeOptions);

                    if (e.event_type === 'sleep' && e.end_time) {
                        icon = "🌙"; name = "Спала";
                        const endTime = new Date(e.end_time);
                        sub = `${timeStr} - ${endTime.toLocaleTimeString('ru-RU', timeOptions)}`;
                        badge = formatDuration(endTime - startTime);
                        timeStr = ""; 
                    } 
                    else if (e.event_type === 'awake' && e.end_time) {
                        icon = "👀"; name = "Бодрствовала";
                        const endTime = new Date(e.end_time);
                        sub = `${timeStr} - ${endTime.toLocaleTimeString('ru-RU', timeOptions)}`;
                        badge = formatDuration(endTime - startTime);
                        timeStr = ""; 
                    }
                    else if (e.event_type === 'feed') { icon = "🍼"; name = "Покушала"; sub = e.details || "Бутылочка"; } 
                    else if (e.event_type === 'diaper') { const det = e.details || ''; icon = det.includes('Пописиюлькала') ? "💦" : "💩"; name = det || "Подгузник"; sub = ""; }
                    else if (e.event_type === 'walk' && e.end_time) {
                        icon = "🚶‍♀️"; name = "Гуляла";
                        const endTime = new Date(e.end_time);
                        sub = `${timeStr} - ${endTime.toLocaleTimeString('ru-RU', timeOptions)}`;
                        badge = formatDuration(endTime - startTime);
                        timeStr = ""; 
                    }

                    let rightSide = timeStr ? `<div class="log-time">${timeStr}</div>` : `<div class="badge-duration">${badge}</div>`;

                    list.innerHTML += `
                        <div class="log-item">
                            <div class="log-left">
                                <div class="log-icon">${icon}</div>
                                <div class="log-name">${name}<br><span class="log-sub">${sub}</span></div>
                            </div>
                            <div class="log-right">
                                ${rightSide}
                                <button class="btn-delete" onclick="deleteEvent(${e.id})">✕</button>
                            </div>
                        </div>
                    `;
                    });
                    list.innerHTML += `</div>`;
                });
            } catch(e) { console.error("Ошибка загрузки событий", e); }
        }

        function startTimer(elementId, startTime, type) {
            const display = document.getElementById(elementId);
            function update() {
                const diff = Math.floor((new Date() - startTime) / 1000);
                display.textContent = `${String(Math.floor(diff / 3600)).padStart(2, '0')}:${String(Math.floor((diff % 3600) / 60)).padStart(2, '0')}:${String(diff % 60).padStart(2, '0')}`;
            }
            update();
            if (timerIntervals[type]) clearInterval(timerIntervals[type]);
            timerIntervals[type] = setInterval(update, 1000);
        }

        // --- СТАТИСТИКА ---
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/events/week`);
                const events = await res.json();
                if (Array.isArray(events)) mergeIntoCache(events);
                
                const todayStr = new Date().toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
                let todayFeeds = 0;
                let todayVolume = 0;
                let todaySleepMs = 0;

                // Считаем карточки за сегодня
                events.forEach(e => {
                    const d = new Date(e.start_time).toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
                    if (d === todayStr) {
                        if (e.event_type === 'feed') { todayFeeds++; const ml = parseInt(e.details); if (!isNaN(ml)) todayVolume += ml; }
                        if (e.event_type === 'sleep' && e.end_time) { todaySleepMs += (new Date(e.end_time) - new Date(e.start_time)); }
                    }
                });

                document.getElementById('stat-feeds').textContent = todayFeeds;
                document.getElementById('stat-sleep').textContent = formatDuration(todaySleepMs);
                document.getElementById('stat-volume').textContent = todayVolume;

                const days = [];
                const feedsByDay = {};
                const diapersByDay = {};
                const sleepByDay = {};
                const awakeByDay = {};
                const walkByDay = {};
                const volumeByDay = {};

                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit' });
                    days.push(dateStr);
                    feedsByDay[dateStr] = 0;
                    diapersByDay[dateStr] = 0;
                    sleepByDay[dateStr] = 0;
                    awakeByDay[dateStr] = 0;
                    walkByDay[dateStr] = 0;
                    volumeByDay[dateStr] = 0;
                }

                // Считаем графики по дням
                events.forEach(e => {
                    const dateStr = new Date(e.start_time).toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit' });
                    if (feedsByDay[dateStr] !== undefined) {
                        if (e.event_type === 'feed') { 
                            feedsByDay[dateStr]++; 
                            const ml = parseInt(e.details); if (!isNaN(ml)) volumeByDay[dateStr] += ml; 
                        }
                        if (e.event_type === 'diaper') diapersByDay[dateStr]++;
                        
                        if (e.end_time) {
                            const hours = (new Date(e.end_time) - new Date(e.start_time)) / (1000 * 60 * 60);
                            if (e.event_type === 'sleep') sleepByDay[dateStr] += hours;
                            if (e.event_type === 'awake') awakeByDay[dateStr] += hours;
                            if (e.event_type === 'walk') walkByDay[dateStr] += hours;
                        }
                    }
                });

                await loadChartLib();
                renderCharts(days, feedsByDay, diapersByDay, sleepByDay, awakeByDay, walkByDay, volumeByDay);

            } catch(e) { console.error("Ошибка статистики", e); toast("Не удалось загрузить статистику", true); }
        }

        // Chart.js (210 КБ) грузим только при первом открытии статистики
        let chartLibPromise = null;
        function loadChartLib() {
            if (typeof Chart !== 'undefined') return Promise.resolve();
            if (!chartLibPromise) {
                chartLibPromise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'chart.js';
                    script.onload = () => resolve();
                    script.onerror = () => { chartLibPromise = null; reject(new Error('chart.js не загрузился')); };
                    (document.head || document.body).appendChild(script);
                });
            }
            return chartLibPromise;
        }

        function renderCharts(labels, feeds, diapers, sleep, awake, walk, volume) {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#F3F4F6' : '#111827';
            const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';

            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: textColor, font: {family: 'Nunito', size: 12, weight: 'bold'} } } },
                scales: {
                    x: { grid: { color: gridColor }, ticks: { color: textColor, font: {family: 'Nunito'} } },
                    y: { grid: { color: gridColor }, ticks: { color: textColor, font: {family: 'Nunito'} }, beginAtZero: true }
                }
            };

            if (chartFeeds) chartFeeds.destroy();
            if (chartSleep) chartSleep.destroy();

            const ctx1 = document.getElementById('chart-feeds').getContext('2d');
            chartFeeds = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Кормления', data: Object.values(feeds), backgroundColor: isDark ? '#7F1D1D' : '#FCA5A5', borderRadius: 6 },
                        { label: 'Подгузники', data: Object.values(diapers), backgroundColor: isDark ? '#1E3A8A' : '#93C5FD', borderRadius: 6 }
                    ]
                },
                options: commonOptions
            });

            // График 2: Суточный цикл (Столбчатая диаграмма с накоплением)
            const ctx2 = document.getElementById('chart-sleep').getContext('2d');
            chartSleep = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Сон', data: Object.values(sleep).map(v => v.toFixed(1)), backgroundColor: '#3b82f6', borderRadius: 4, stack: 'Stack 0' },
                        { label: 'Бодрствует', data: Object.values(awake).map(v => v.toFixed(1)), backgroundColor: '#fcd34d', borderRadius: 4, stack: 'Stack 0' },
                        { label: 'Гуляет', data: Object.values(walk).map(v => v.toFixed(1)), backgroundColor: '#10b981', borderRadius: 4, stack: 'Stack 0' }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: { 
                        x: commonOptions.scales.x, 
                        y: { ...commonOptions.scales.y, stacked: true } 
                    }
                }
            });

            // График 3: Объем смеси
            const ctx3 = document.getElementById('chart-volume').getContext('2d');
            if (window.chartVolume) window.chartVolume.destroy();
            window.chartVolume = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Выпито (мл)',
                        data: Object.values(volume),
                        backgroundColor: isDark ? '#7F1D1D' : '#FCA5A5',
                        borderRadius: 6
                    }]
                },
                options: commonOptions
            });
        }

        // --- WEB PUSH ---
        async function subscribePush() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                toast("Push не поддерживается. На iPhone добавьте сайт на экран «Домой».", true);
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') { toast("Уведомления отклонены", true); return; }

                const res = await fetch(`${API_URL}/vapid-public-key`);
                const { publicKey } = await res.json();
                
                const registration = await navigator.serviceWorker.ready;
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicKey)
                });

                await fetch(`${API_URL}/subscribe`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(subscription)
                });

                toast("✅ Уведомления включены!");
                document.getElementById('push-btn').style.display = 'none';
            } catch (e) {
                console.error(e);
                toast("Ошибка включения уведомлений", true);
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/baby/sw.js')
                    .then(reg => console.log('✅ SW зарегистрирован:', reg.scope))
                    .catch(err => console.error('❌ Ошибка SW:', err));
            });
        }

        
        // --- КАЛЕНДАРЬ ---
        function openAppModal() { 
            document.getElementById('app-modal').style.display = 'flex'; 
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('app-date').value = now.toISOString().slice(0,16);
        }
        function closeAppModal(e) { if (!e || e.target.id === 'app-modal') document.getElementById('app-modal').style.display = 'none'; }
        
        async function saveAppointment() {
            const title = document.getElementById('app-title').value;
            const dateTime = document.getElementById('app-date').value;
            const notes = document.getElementById('app-notes').value;
            if (!title || !dateTime) { toast("Заполните название и дату", true); return; }
            await fetch(`${API_URL}/appointments`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title: title, date_time: dateTime, notes: notes })
            });
            closeAppModal();
            document.getElementById('app-title').value = '';
            document.getElementById('app-notes').value = '';
            loadAppointments();
        }

        async function loadAppointments() {
            try {
                const res = await fetch(`${API_URL}/appointments`);
                let apps = await res.json();
                if (!Array.isArray(apps)) apps = [];
                window.__lastAppointments = apps;
                const list = document.getElementById('app-list');
                list.innerHTML = '';
                if (apps.length === 0) {
                    list.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted);">Нет записей. Добавьте первую!</div>';
                    return;
                }
                apps.forEach(a => {
                    const dt = new Date(a.date_time);
                    const dateStr = dt.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const timeStr = dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    list.innerHTML += `
                        <div class="log-item">
                            <div class="log-left">
                                <div class="log-icon">🏥</div>
                                <div class="log-name">${a.title}<br><span class="log-sub">${dateStr} в ${timeStr} ${a.notes ? '· ' + a.notes : ''}</span></div>
                            </div>
                            <div class="log-right">
                                <button class="btn-delete" onclick="deleteAppointment(${a.id})">✕</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { console.error("Ошибка календаря", e); }
        }

        async function deleteAppointment(id) {
            if (!confirm("Удалить эту запись?")) return;
            await fetch(`${API_URL}/appointments/${id}`, { method: 'DELETE' });
            loadAppointments();
        }

        loadEvents();
        loadAppointments();
        renderStatus();
        flushQueue();
        setInterval(() => { if (document.visibilityState === 'visible') loadEvents(); }, 30000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadEvents(); });
    </script>
    <div class="toast-host" id="toast-host"></div>
</body>
</html>
