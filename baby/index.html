<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Трекер малыша</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>">
    <link rel="manifest" href="manifest.json">
    
    <!-- Шрифт Nunito для мягкого стиля -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="chart.js"></script>
    
    <style>
        /* УМНАЯ ТЕМА */
        :root[data-theme="light"] {
            --bg: #F3F4F6; --card: #FFFFFF; --text: #1F2937; --muted: #6B7280;
            --border: #E5E7EB; --shadow: rgba(0,0,0,0.05);
            --accent-feed: #FCA5A5; --accent-sleep: #93C5FD; --accent-noise: #6EE7B7; --accent-sos: #F87171;
            --btn-text: #FFFFFF;
        }
        :root[data-theme="dark"] {
            --bg: #0F1014; --card: #1C1D22; --text: #E5E7EB; --muted: #9CA3AF;
            --border: #2D2E36; --shadow: rgba(0,0,0,0.5);
            --accent-feed: #7F1D1D; --accent-sleep: #1E3A8A; --accent-noise: #064E3B; --accent-sos: #991B1B;
            --btn-text: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-top: env(safe-area-inset-top); padding-bottom: calc(80px + env(safe-area-inset-bottom)); min-height: 100vh; transition: background 0.4s, color 0.4s; }
        
        .view { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
        .view.active { display: block; opacity: 1; animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { position: sticky; top: 0; z-index: 10; padding: 20px; text-align: center; background: rgba(var(--bg), 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .header h1 { font-size: 22px; font-weight: 800; }
        .last-feed-badge { background: var(--accent-feed); color: var(--btn-text); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; display: none; box-shadow: 0 4px 10px var(--shadow); }
        
        /* Таймер */
        .timer-section { padding: 24px; text-align: center; background: var(--card); border-radius: 28px; margin: 20px 20px 10px 20px; border: 1px solid var(--border); box-shadow: 0 8px 20px var(--shadow); animation: pulse-border 3s infinite; display: none; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(199, 206, 234, 0.4); } 50% { box-shadow: 0 0 0 15px rgba(199, 206, 234, 0); } 100% { box-shadow: 0 0 0 0 rgba(199, 206, 234, 0); } }
        .timer-display { font-size: 56px; font-weight: 800; margin-bottom: 20px; color: var(--text); }
        .btn-stop { background: var(--accent-sos); color: white; border: none; padding: 16px; border-radius: 20px; font-size: 17px; font-weight: 800; width: 100%; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 15px var(--shadow); }
        .btn-stop:active { transform: scale(0.95); }
        
        /* Сетка кнопок */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 10px 20px; margin-top: 10px; }
        .action-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 20px 10px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px var(--shadow); }
        .action-btn:active { transform: scale(0.95); box-shadow: 0 2px 5px var(--shadow); }
        .action-btn .icon { font-size: 36px; }
        
        .btn-feed { grid-column: span 2; background: var(--accent-feed); color: var(--btn-text); border: none; }
        .btn-sleep { grid-column: span 2; background: var(--accent-sleep); color: var(--btn-text); border: none; }
        .btn-noise { grid-column: span 2; background: var(--accent-noise); color: var(--btn-text); border: none; }
        .btn-sos { grid-column: span 2; background: var(--accent-sos); color: var(--btn-text); border: none; font-size: 18px; padding: 16px; }

        /* Лента */
        .log-section { padding: 20px; }
        .log-list { background: var(--card); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 12px var(--shadow); }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
        .log-item:last-child { border-bottom: none; }
        .log-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .log-icon { font-size: 24px; background: var(--bg); padding: 8px; border-radius: 14px; }
        .log-name { font-weight: 700; font-size: 16px; }
        .log-sub { color: var(--muted); font-size: 13px; font-weight: 600; }
        .log-right { display: flex; align-items: center; gap: 10px; }
        .log-time { color: var(--text); font-weight: 700; font-size: 14px; background: var(--bg); padding: 4px 10px; border-radius: 10px; }
        .badge-duration { color: var(--text); font-size: 13px; font-weight: 700; background: var(--accent-noise); padding: 4px 10px; border-radius: 10px; }
        .btn-delete { background: none; border: none; color: var(--muted); font-size: 20px; padding: 5px; cursor: pointer; transition: 0.2s; }
        .btn-delete:active { color: var(--accent-sos); transform: scale(0.8); }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 50; box-shadow: 0 -4px 12px var(--shadow); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; background: none; border: none; width: 50%; transition: 0.2s; }
        .nav-item.active { color: var(--text); }
        .nav-item .icon { font-size: 26px; }

        /* Статистика */
        .stats-container { padding: 20px; }
        .stat-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); padding: 16px 8px; border-radius: 24px; text-align: center; box-shadow: 0 4px 12px var(--shadow); }
        .stat-card .value { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.2; }
        .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 12px var(--shadow); }
        .chart-wrap { position: relative; height: 220px; width: 100%; }
        .chart-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--text); text-align: center; }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-end; }
        .modal-content { background: var(--card); width: 100%; border-radius: 32px 32px 0 0; padding: 24px; animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding-bottom: calc(24px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px var(--shadow); }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h2 { font-size: 22px; font-weight: 800; }
        .btn-close { background: var(--bg); border: none; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        /* Слайдер для мл */
        .slider-container { text-align: center; margin-bottom: 20px; }
        .slider-value { font-size: 48px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
        .slider-value span { font-size: 24px; color: var(--muted); }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 10px; background: var(--border); border-radius: 10px; outline: none; margin-bottom: 20px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-feed); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        .btn-save-ml { background: var(--accent-feed); color: white; border: none; padding: 16px; border-radius: 20px; font-size: 18px; font-weight: 800; width: 100%; cursor: pointer; box-shadow: 0 4px 15px var(--shadow); transition: transform 0.2s; }
        .btn-save-ml:active { transform: scale(0.95); }

        /* Белый шум */
        .noise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .noise-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 16px; border-radius: 20px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .noise-btn.active { border-color: var(--accent-noise); background: var(--accent-noise); color: var(--btn-text); }
        .noise-btn .icon { font-size: 32px; }
        
        .player-controls { display: flex; flex-direction: column; align-items: center; gap: 24px; background: var(--bg); padding: 24px; border-radius: 24px; }
        .btn-play-main { background: var(--accent-noise); border: none; color: white; width: 72px; height: 72px; border-radius: 50%; font-size: 28px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; box-shadow: 0 8px 20px var(--shadow); }
        .btn-play-main.playing { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(181, 234, 215, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(181, 234, 215, 0); } 100% { box-shadow: 0 0 0 0 rgba(181, 234, 215, 0); } }

        .volume-container { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--muted); font-size: 20px; }
        .volume-slider { flex: 1; height: 6px; background: var(--border); border-radius: 10px; outline: none; -webkit-appearance: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--text); cursor: pointer; }
    </style>
</head>
<body>

    <div id="view-tracker" class="view active">
        <div class="header">
            <h1>👶 Трекер малыша</h1>
            <div class="last-feed-badge" id="last-feed-badge">🍼 Последнее кормление: давно</div>
        </div>

        <div class="timer-section" id="timer-section">
            <div class="timer-display" id="timer-display">00:00:00</div>
            <button class="btn-stop" onclick="stopSleep()">Малыш проснулся</button>
        </div>

        <div class="grid">
            <button class="action-btn btn-feed" onclick="openFeedModal()"><span class="icon">🍼</span> Покормить</button>
            <button class="action-btn" onclick="quickEvent('diaper', 'Писал')"><span class="icon">💦</span> Писал</button>
            <button class="action-btn" onclick="quickEvent('diaper', 'Какал')"><span class="icon">💩</span> Какал</button>
            <button class="action-btn btn-sleep" id="sleep-btn" onclick="startSleep()"><span class="icon">😴</span> Уложить спать</button>
            <button class="action-btn btn-noise" onclick="openNoiseModal()"><span class="icon">🎵</span> Белый шум</button>
            <button class="action-btn btn-sos" onclick="sendSOS()"><span class="icon">🆘</span> Да блять!</button>
            <button class="action-btn" id="push-btn" onclick="subscribePush()" style="grid-column: span 2; background: var(--bg);">
                <span class="icon">🔔</span> Включить уведомления
            </button>        
        </div>

        <div class="log-section">
            <div class="log-list" id="log-list"></div>
        </div>
    </div>

    <div id="view-stats" class="view">
        <div class="header">
            <h1>📊 Статистика</h1>
        </div>
        
        <div class="stats-container">
            <div class="stat-cards">
                <div class="stat-card">
                    <div class="value" id="stat-feeds">0</div>
                    <div class="label">Кормлений</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="stat-sleep">0ч</div>
                    <div class="label">Сна</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="stat-volume">0</div>
                    <div class="label">Съел (мл)</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Кормления и подгузники (7 дней)</div>
                <div class="chart-wrap"><canvas id="chart-feeds"></canvas></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Часы сна (7 дней)</div>
                <div class="chart-wrap"><canvas id="chart-sleep"></canvas></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchView('tracker', this)">
            <span class="icon">🏠</span> Трекер
        </button>
        <button class="nav-item" onclick="switchView('stats', this)">
            <span class="icon">📊</span> Статистика
        </button>
    </div>

    <!-- МОДАЛКА КОРМЛЕНИЯ (СЛАЙДЕР) -->
    <div class="modal-overlay" id="feed-modal" onclick="closeFeedModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Сколько съел?</h2>
                <button class="btn-close" onclick="closeFeedModal()">✕</button>
            </div>
            <div class="slider-container">
                <div class="slider-value"><span id="ml-value">120</span> <span>мл</span></div>
                <input type="range" id="ml-slider" min="10" max="240" step="10" value="120" oninput="document.getElementById('ml-value').innerText = this.value">
                <button class="btn-save-ml" onclick="saveFeedVolume()">Записать кормление</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА БЕЛОГО ШУМА -->
    <div class="modal-overlay" id="noise-modal" onclick="closeNoiseModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Белый шум</h2>
                <button class="btn-close" onclick="closeNoiseModal()">✕</button>
            </div>
            <div class="noise-grid">
                <button class="noise-btn active" data-sound="white" onclick="changeNoise(this)"><span class="icon">📻</span> Белый шум</button>
                <button class="noise-btn" data-sound="rain" onclick="changeNoise(this)"><span class="icon">🌧️</span> Дождь</button>
                <button class="noise-btn" data-sound="womb" onclick="changeNoise(this)"><span class="icon">🤰</span> Утроба</button>
                <button class="noise-btn" data-sound="heart" onclick="changeNoise(this)"><span class="icon">❤️</span> Сердце</button>
            </div>
            <div class="player-controls">
                <button class="btn-play-main" id="play-pause-btn" onclick="toggleAudio()">▶</button>
                <div class="volume-container">
                    <span>🔈</span>
                    <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.5" oninput="setVolume(this.value)">
                    <span>🔊</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // УМНАЯ ТЕМА (По умолчанию — темная)
        const currentHour = new Date().getHours();
        // Включаем светлую только днем (с 9 до 19), иначе темная
        const theme = (currentHour >= 9 && currentHour < 19) ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        const API_URL = 'https://telegram-bot-zakharsakharov.msk1.amvera.tech/api/baby';
        let activeSleepId = null;
        let timerInterval = null;
        let chartFeeds = null;
        let chartSleep = null;

        function switchView(viewName, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            btn.classList.add('active');
            if (viewName === 'stats') loadStats();
        }

        // --- КНОПКА SOS ---
        async function sendSOS() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]); // Тревожная вибрация
            try {
                await fetch(`${API_URL}/sos`, { method: 'POST' });
                alert("🆘 SOS отправлен партнеру!");
            } catch(e) {
                alert("Ошибка отправки SOS.");
            }
        }

        // --- КОРМЛЕНИЕ (СЛАЙДЕР) ---
        function openFeedModal() { document.getElementById('feed-modal').style.display = 'flex'; }
        function closeFeedModal(e) { if (!e || e.target.id === 'feed-modal') document.getElementById('feed-modal').style.display = 'none'; }
        async function saveFeedVolume() {
            const ml = document.getElementById('ml-slider').value;
            closeFeedModal();
            if (navigator.vibrate) navigator.vibrate(50);
            await fetch(`${API_URL}/events/quick`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({event_type: 'feed', details: ml + ' мл'}) });
            loadEvents();
        }

        // --- АУДИО ---
        let audioCtx = null, gainNode = null, currentSource = null;
        let audioBuffers = {}, isPlaying = false, currentSound = 'white', isAudioLoading = false;
        const sounds = { 'white': 'sounds/white.mp3', 'rain': 'sounds/rain.mp3', 'womb': 'sounds/womb.mp3', 'heart': 'sounds/heart.mp3' };
        const playPauseBtn = document.getElementById('play-pause-btn');

        async function unlockAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            gainNode = audioCtx.createGain(); gainNode.gain.value = 0.5; gainNode.connect(audioCtx.destination);
        }
        async function loadSound(soundName) {
            if (audioBuffers[soundName]) return audioBuffers[soundName];
            const response = await fetch(sounds[soundName]);
            if (!response.ok) throw new Error("Файл не найден");
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[soundName] = await audioCtx.decodeAudioData(arrayBuffer);
            return audioBuffers[soundName];
        }
        function stopCurrentAudio() {
            if (currentSource) { try { currentSource.stop(); currentSource.disconnect(); } catch(e){} currentSource = null; }
            isPlaying = false; playPauseBtn.textContent = '▶'; playPauseBtn.classList.remove('playing');
        }
        async function playSound(soundName) {
            if (isAudioLoading) return;
            isAudioLoading = true;
            stopCurrentAudio();
            await unlockAudio();
            try {
                const buffer = await loadSound(soundName);
                currentSource = audioCtx.createBufferSource(); currentSource.buffer = buffer;
                currentSource.loop = true; currentSource.connect(gainNode); currentSource.start(0);
                isPlaying = true; playPauseBtn.textContent = '⏸'; playPauseBtn.classList.add('playing');
            } catch (e) { alert("Ошибка загрузки звука."); }
            finally { isAudioLoading = false; }
        }
        async function changeNoise(btn) {
            document.querySelectorAll('.noise-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); currentSound = btn.getAttribute('data-sound');
            if (isPlaying) await playSound(currentSound);
        }
        async function toggleAudio() { if (isPlaying) { stopCurrentAudio(); } else { await playSound(currentSound); } }
        function setVolume(val) { if (gainNode) gainNode.gain.value = val; }
        function openNoiseModal() { document.getElementById('noise-modal').style.display = 'flex'; }
        function closeNoiseModal(e) { if (!e || e.target.id === 'noise-modal') document.getElementById('noise-modal').style.display = 'none'; }

        // --- ТРЕКЕР ---
        function formatDuration(ms) {
            const totalMinutes = Math.floor(ms / 60000);
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            if (h > 0) return `${h}ч ${m}м`;
            return `${m}м`;
        }

        async function deleteEvent(id) {
            if (!confirm("Удалить эту запись?")) return;
            await fetch(`${API_URL}/events/${id}`, { method: 'DELETE' });
            loadEvents();
        }

        async function loadEvents() {
            try {
                const res = await fetch(`${API_URL}/events/today`);
                let events = await res.json();
                if (!Array.isArray(events)) events = [];
                
                const activeSleep = events.find(e => e.event_type === 'sleep' && !e.end_time);
                if (activeSleep) {
                    activeSleepId = activeSleep.id;
                    document.getElementById('timer-section').style.display = 'block';
                    document.getElementById('sleep-btn').style.display = 'none';
                    startTimer(new Date(activeSleep.start_time));
                } else {
                    activeSleepId = null;
                    document.getElementById('timer-section').style.display = 'none';
                    document.getElementById('sleep-btn').style.display = 'flex';
                    if (timerInterval) clearInterval(timerInterval);
                }

                const lastFeed = events.find(e => e.event_type === 'feed');
                const feedBadge = document.getElementById('last-feed-badge');
                if (lastFeed) {
                    feedBadge.style.display = 'inline-block';
                    feedBadge.textContent = `🍼 Последнее: ${formatDuration(new Date() - new Date(lastFeed.start_time))} назад`;
                } else { feedBadge.style.display = 'none'; }

                const list = document.getElementById('log-list');
                list.innerHTML = '';
                const today = new Date();
                
                events.forEach(e => {
                    if (e.event_type === 'sleep' && !e.end_time) return; 

                    let icon = "", name = "", sub = "", timeStr = "", badge = "";
                    const startTime = new Date(e.start_time);
                    const timeOptions = { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' };
                    timeStr = startTime.toLocaleTimeString('ru-RU', timeOptions);

                    if (e.event_type === 'sleep' && e.end_time) {
                        icon = "🌙"; name = "Сон";
                        const endTime = new Date(e.end_time);
                        sub = `${timeStr} - ${endTime.toLocaleTimeString('ru-RU', timeOptions)}`;
                        badge = formatDuration(endTime - startTime);
                        timeStr = ""; 
                    } 
                    else if (e.event_type === 'feed') { icon = "🍼"; name = "Кормление"; sub = e.details || "Бутылочка"; } 
                    else if (e.event_type === 'diaper') { icon = e.details === 'Какал' ? "💩" : "💦"; name = "Подгузник"; sub = e.details; }

                    let rightSide = timeStr ? `<div class="log-time">${timeStr}</div>` : `<div class="badge-duration">${badge}</div>`;

                    list.innerHTML += `
                        <div class="log-item">
                            <div class="log-left">
                                <div class="log-icon">${icon}</div>
                                <div class="log-name">${name}<br><span class="log-sub">${sub}</span></div>
                            </div>
                            <div class="log-right">
                                ${rightSide}
                                <button class="btn-delete" onclick="deleteEvent(${e.id})">✕</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { console.error("Ошибка загрузки событий", e); }
        }

        function startTimer(startTime) {
            if (timerInterval) clearInterval(timerInterval);
            const display = document.getElementById('timer-display');
            function update() {
                const diff = Math.floor((new Date() - startTime) / 1000);
                display.textContent = `${String(Math.floor(diff / 3600)).padStart(2, '0')}:${String(Math.floor((diff % 3600) / 60)).padStart(2, '0')}:${String(diff % 60).padStart(2, '0')}`;
            }
            update(); timerInterval = setInterval(update, 1000);
        }

        async function startSleep() {
            if (navigator.vibrate) navigator.vibrate(50);
            await fetch(`${API_URL}/events/start`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({event_type: 'sleep'}) });
            loadEvents();
        }

        async function stopSleep() {
            if (!activeSleepId) return;
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            await fetch(`${API_URL}/events/${activeSleepId}/stop`, { method: 'POST' });
            loadEvents();
        }

        async function quickEvent(type, details) {
            if (navigator.vibrate) navigator.vibrate(50);
            await fetch(`${API_URL}/events/quick`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({event_type: type, details: details}) });
            loadEvents();
        }

        // --- СТАТИСТИКА ---
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/events/week`);
                const events = await res.json();
                
                const todayStr = new Date().toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
                let todayFeeds = 0;
                let todayVolume = 0;
                let todaySleepMs = 0;

                events.forEach(e => {
                    const d = new Date(e.start_time).toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
                    if (d === todayStr) {
                        if (e.event_type === 'feed') { todayFeeds++; const ml = parseInt(e.details); if (!isNaN(ml)) todayVolume += ml; }
                        if (e.event_type === 'sleep' && e.end_time) { todaySleepMs += (new Date(e.end_time) - new Date(e.start_time)); }
                    }
                });

                document.getElementById('stat-feeds').textContent = todayFeeds;
                document.getElementById('stat-sleep').textContent = formatDuration(todaySleepMs);
                document.getElementById('stat-volume').textContent = todayVolume;

                const days = [];
                const feedsByDay = {};
                const diapersByDay = {};
                const sleepByDay = {};

                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit' });
                    days.push(dateStr);
                    feedsByDay[dateStr] = 0;
                    diapersByDay[dateStr] = 0;
                    sleepByDay[dateStr] = 0;
                }

                events.forEach(e => {
                    const dateStr = new Date(e.start_time).toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit' });
                    if (feedsByDay[dateStr] !== undefined) {
                        if (e.event_type === 'feed') feedsByDay[dateStr]++;
                        if (e.event_type === 'diaper') diapersByDay[dateStr]++;
                        if (e.event_type === 'sleep' && e.end_time) sleepByDay[dateStr] += (new Date(e.end_time) - new Date(e.start_time)) / (1000 * 60 * 60);
                    }
                });

                renderCharts(days, feedsByDay, diapersByDay, sleepByDay);

            } catch(e) { console.error("Ошибка статистики", e); }
        }

        function renderCharts(labels, feeds, diapers, sleep) {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#EAEAEA' : '#4A4A4A';
            const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';

            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: textColor, font: {family: 'Nunito', size: 12, weight: 'bold'} } } },
                scales: {
                    x: { grid: { color: gridColor }, ticks: { color: textColor, font: {family: 'Nunito'} } },
                    y: { grid: { color: gridColor }, ticks: { color: textColor, font: {family: 'Nunito'} }, beginAtZero: true }
                }
            };

            if (chartFeeds) chartFeeds.destroy();
            if (chartSleep) chartSleep.destroy();

            const ctx1 = document.getElementById('chart-feeds').getContext('2d');
            chartFeeds = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Кормления', data: Object.values(feeds), backgroundColor: isDark ? '#A35C58' : '#FFB7B2', borderRadius: 6 },
                        { label: 'Подгузники', data: Object.values(diapers), backgroundColor: isDark ? '#6A728C' : '#C7CEEA', borderRadius: 6 }
                    ]
                },
                options: commonOptions
            });

            const ctx2 = document.getElementById('chart-sleep').getContext('2d');
            chartSleep = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Часы сна',
                        data: Object.values(sleep).map(v => v.toFixed(1)),
                        borderColor: isDark ? '#6A8C7A' : '#B5EAD7',
                        backgroundColor: isDark ? 'rgba(106, 140, 122, 0.2)' : 'rgba(181, 234, 215, 0.4)',
                        fill: true, tension: 0.4, borderWidth: 3, pointRadius: 4
                    }]
                },
                options: commonOptions
            });
        }

        // --- WEB PUSH ---
        async function subscribePush() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert("Ваш браузер не поддерживает Push-уведомления. На iPhone добавьте сайт на экран 'Домой'.");
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    alert("Вы отклонили уведомления.");
                    return;
                }

                const res = await fetch(`${API_URL}/vapid-public-key`);
                const { publicKey } = await res.json();
                
                const registration = await navigator.serviceWorker.ready;
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicKey)
                });

                await fetch(`${API_URL}/subscribe`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(subscription)
                });

                alert("✅ Уведомления включены!");
                document.getElementById('push-btn').style.display = 'none';
            } catch (e) {
                console.error(e);
                alert("Ошибка включения уведомлений. Проверьте, что вы добавили сайт на экран 'Домой'.");
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/baby/sw.js')
                    .then(reg => console.log('✅ SW зарегистрирован:', reg.scope))
                    .catch(err => console.error('❌ Ошибка SW:', err));
            });
        }

        loadEvents();
        setInterval(loadEvents, 30000);
    </script>
